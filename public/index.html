<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkShort - URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>LinkShort</h1>
        <p>Make your long URLs short and simple!</p>

        <input
            type="url"
            id="longUrl"
            placeholder="Enter your long URL"
        >

        <button id="shortenBtn">Shorten URL</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
